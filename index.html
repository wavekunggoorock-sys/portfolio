<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Portfolio</title>
    
</head>
<body>
    
    <header>
        <a href="#" class="logo" class="transition-link">Niroonthep Onkratok</a>

        <nav>
            <a href="#" class="active" class="transition-link">Home</a>
            <a href="AboutMe.html" class="transition-link">About Me</a>
            <a href="Projects.html" class="transition-link">Projects</a>
            <a href="Contact.html" class="transition-link">Contact</a>
        </nav>
    </header>
    <section class="home">
        <div class="home-img">
            <img src="Image/shared image (4).png" alt="Profile Picture" >
        </div>
        <div class="home-content">
            <h1>Welcome to <span> My Portfolio </span></h1>
            
            <h3 class="typing-text">I'm <span></span></h3>
            <p style="font-size: 16px;">Hello! My name is Niroonthep Onkratok, a passionate web developer. 
              <br>This is a showcase of my work and skills.My Personal Infomation My project and a lots</p>
            
            <div class="social-icons">
                <a href="https://www.linkedin.com/in/niroonthep-onkrtok-236432384" target="_blank"><i class="fa-brands fa-linkedin"></i></a>
                <a href="https://github.com/wavekunggoorock-sys" target="_blank"><i class="fa-brands fa-github"></i></a>
                <a href="https://www.facebook.com/StoryGamingGame" target="_blank"><i class="fa-brands fa-facebook"></i></a>
                <a href="https://www.instagram.com/x._wxve_.x/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            </div>
            <a href="Contact.html" class="btn" class="transition-link">Hire me</a>
        </div>
    </section>
    <script>
  const header = document.querySelector("header");

  window.addEventListener("scroll", () => {
    if (window.scrollY > 50) {
      header.classList.add("scrolled"); // เพิ่มคลาสเมื่อ scroll ลง
    } else {
      header.classList.remove("scrolled"); // เอาคลาสออกเมื่อ scroll ขึ้น
    }
  });

  document.querySelectorAll('.transition-link').forEach(link => {
  link.addEventListener('click', function(e) {
    const href = this.getAttribute('href');

    // ถ้า href เป็นลิงก์ภายนอก (เริ่มด้วย http)
    if (href.startsWith('http')) {
      // เปิดปกติในแท็บใหม่
      return;
    }

    // ถ้าเป็นลิงก์ภายในเว็บ ให้ทำ fade-out
    e.preventDefault();
    document.body.classList.add('fade-out');
    setTimeout(() => {
      window.location.href = href;
    }, 500);
  });
});

// ตอนโหลดหน้าใหม่
window.addEventListener('load', () => {
  document.body.classList.add('fade-in');
});
</script>
</body>

</html>
