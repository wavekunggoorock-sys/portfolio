<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
    <header>
    <a href="index.html" class="logo" class="transition-link">Niroonthep Onkratok</a>
    <nav>
      <a href="index.html" class="transition-link">Home</a>
      <a href="AboutMe.html" class="transition-link">About Me</a>
      <a href="Projects.html" class="transition-link">Projects</a>
      <a href="#" class="active" class="transition-link">Contact</a>
    </nav>
  </header>
    <section class="contact-section">
        <div class="contact-container">
        <h2 class="contact-heading">Contact Me</h2>
    
        <div class="contact-cards">
        
            <div class="contact-card">
                <i class="fa-brands fa-facebook"></i>
                <h3>Facebook</h3>
                <p>Niroonthep Onkratok</p>
            </div>

            <div class="contact-card">
                <i class="fa-brands fa-instagram"></i>
                <h3>Instagram</h3>
                <p>x._wxve_.x</p>
            </div>

            <div class="contact-card">
                <i class="fa-brands fa-line"></i>
                <h3>Line ID</h3>
                <p>wave_niruntep</p>

            </div>
            
            <div class="contact-card">
                <i class="fa-solid fa-envelope"></i>
                <h3>Email</h3>
                <p>wavekunggoorock@gmail.com</p>
            </div>

            <div class="contact-card">
                <i class="fa-solid fa-phone"></i>
                <h3>Phone</h3>
                <p>+66 91 255 8737</p>
            </div>

            <div class="contact-card">
                <i class="fa-solid fa-location-dot"></i>
                <h3>Location</h3>
                <p>Bangkok, Thailand</p>
            </div>
        </div>

        <div class="contact-image-container">
            <img src="Image/shared image (2).png" alt="Decorative Image">
        </div>
  </div>
</section>

<script>
const header = document.querySelector('header');
window.addEventListener('scroll', () => {
    if(window.scrollY > 50){
        header.classList.add('scrolled');
    } else {
        header.classList.remove('scrolled');
    }
});

document.querySelectorAll('.transition-link').forEach(link => {
  link.addEventListener('click', function(e) {
    e.preventDefault();
    const href = this.getAttribute('href');
    document.body.classList.add('fade-out');
    setTimeout(() => {
      window.location.href = href;
    }, 500); // เวลาให้ fade-out เสร็จ
  });
});

// ตอนโหลดหน้าใหม่
window.addEventListener('load', () => {
  document.body.classList.add('fade-in');
});
</script>
</body>
</html>
